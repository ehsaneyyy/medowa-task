<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="core-store-api" content="https://medowa-task.onrender.com">
  <title>Core Store</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Core Store home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Core Store</span>
      </a>
      <nav class="nav-scroll" id="category-nav" aria-label="Product categories">
        <a class="nav-link" href="#/" data-nav="all">Store</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <div class="state-panel">
      <p class="state-title">Loading the store</p>
      <p class="state-text">Fetching the latest catalog.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-note">Copyright &copy; 2026 Core Store. All rights reserved.</p>
      <p class="footer-sub">Core Store is a demonstration storefront. Product names and imagery belong to their respective owners.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
