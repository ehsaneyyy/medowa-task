databases:
  - name: medowa-db
    plan: free
    databaseName: medowa
    user: medowa

services:
  - type: web
    name: medowa-task
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn medowa_task.wsgi:application --bind 0.0.0.0:$PORT'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: '.onrender.com'
      - key: DATABASE_URL
        fromDatabase:
          name: medowa-db
          property: connectionString
